[package]
name = "diffscape"
version = "0.1.0"
description = "Read-only Git worktree change explorer"
authors = ["Diffscape"]
edition = "2021"

[lib]
name = "diffscape_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
notify = "8"
